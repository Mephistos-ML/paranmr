# Project build, packaging, and tooling configuration.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paranmr"
dynamic = ["version"]
description = "Prediction, fitting, and analysis of paramagnetic NMR spectra."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

authors = [
    { name = "Suturina Group (original)" },
]
maintainers = [
    { name = "Ernest Borysenko", email = "eb2819@bath.ac.uk" },
]

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

keywords = [
    "paramagnetic NMR",
    "NMR spectroscopy",
    "susceptibility",
    "hyperfine coupling",
    "quantum chemistry",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "matplotlib",
    "pandas",
    "pathos",
    "PyYAML",
    "pyyaml-include",
    "adjustText",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1.0",
]
synthetic = [
    "ParaNMR-Synth>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/Mephistos-ML/paranmr"
Documentation = "https://mephistos-ml.github.io/paranmr/"
Repository = "https://github.com/Mephistos-ML/paranmr"
Issues = "https://github.com/Mephistos-ML/paranmr/issues"
"Original Source" = "https://gitlab.com/suturina-group/simpnmr"

[project.scripts]
paranmr = "paranmr.cli.main:interface"
plot_A_funcs = "paranmr.tools.hfc_plot_batch:main"
plot_chi_funcs = "paranmr.tools.susc_plot_batch:main"
xyz_to_chemlabel = "paranmr.tools.coords.chemcraft:main"

[tool.setuptools.dynamic]
version = { attr = "paranmr.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["paranmr*"]
namespaces = false

[tool.semantic_release]
version_variables = ["paranmr/__version__.py:__version__"]
branch = "main"
commit_parser = "conventional"
build_command = "python -m pip install build && python -m build --sdist --wheel ."
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version}"

[tool.semantic_release.remote]
type = "github"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-ra -q"
markers = [
    "integration: end-to-end workflow tests (may be slow)",
    "smoke: fast smoke tests for CLI/entrypoints",
    "unit: fast unit tests with no subprocess, no network, minimal IO",
]

log_cli = true
log_cli_level = "INFO"
