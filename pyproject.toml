# Project build, packaging, and tooling configuration.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.semantic_release]
version_variables = ["paranmr/__version__.py:__version__"]
branch = "main"
commit_parser = "conventional"
build_command = "python -m build --sdist --wheel ."
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version}"

[tool.semantic_release.remote]
type = "gitlab"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-ra -q"
markers = [
    "integration: end-to-end example/CLI integration tests (may be slow)",
    "smoke: fast smoke tests for CLI/entrypoints",
    "unit: fast unit tests with no subprocess, no network, minimal IO",
]

log_cli = true
log_cli_level = "INFO"
