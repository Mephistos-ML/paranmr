project:
  name: test_diag_equal

hyperfine:
  method: dft
  file: ni_0_cpcm_tpssh.out

experiment:
  files: [exp/*.csv]

diamagnetic:
  method: csv
  file: dia.csv

chem_labels:
  file: chem_labels.csv

nuclei:
  include: H

susc_fit:
  type: isoaxrho
  variables:
    iso: [fit, 0.001]
    ax: [fit, 0.001]
    rho_over_ax: [fix, 0.00]
  average_shifts: 'all'

assignment:
  method: hungarian  # Will be switched to permute for comparison test
  groups:  # Required for permute method
    - [tphz1, tpy1]
    - [tpy5, tpy4]
    - [tphz2, tpy2]
    - [tpy6, tpy3, tphz3]
