project:
  name: YbL8_1H_PD_fit_Moments
  
hyperfine:
  method: pdip
  file: ../../../../DATA/HFC/YbL8.xyz
  paramagnetic_centre: [0.0, 0.0, 0.0]
  spin: 0.5
  orbit: 3
  total_momentum_J: 3.5

nuclei:
  include: H
  
diamagnetic:
  method: dft
  file: ../../../../DATA/DIA/LuL8_DIA_NMR.out

diamagnetic_ref:
  method: dft
  file: ../../../../DATA/DIA/tms_ref.out

experiment:
  files: ../../../../DATA/PARA/exp.csv

signal_labels:
  file: ../../../../DATA/LABELS/YbL8_labels.csv

assignment:
  method: moments
  max_moment_order: 10

linewidth:
  method: r6
  variables:
    p1: [fix, 705.05]
    p2: [fix, 0.25]
    
susc_fit:
  type: split
  variables:
    iso: [fix, 0.00]
    dxx: [fit, -0.00019757281708754741]
    dyy: [fit, -0.0003304447559885367]
    dxy: [fit, 1.9802897554284196e-05]
    dxz: [fit, -0.0003419611728294868]
    dyz: [fit, -4.988064468483049e-05]
  average_shifts: all
  objective_map:
    parameters: [dxx, dyy]
