project:
  name: simpnmr_x_gmm_fitted_output
hyperfine:
  method: pdip
  file: ../../DATA/HFC/YbL8.xyz
  paramagnetic_centre:
  - 0.0
  - 0.0
  - 0.0
  spin: 0.5
  orbit: 3.0
  total_momentum_J: 3.5
nuclei:
  include: H
signal_labels:
  file: ../../DATA/LABELS/YbL8_labels.csv
diamagnetic:
  method: dft
  file: ../../DATA/DIA/LuL8_DIA_NMR.out
diamagnetic_ref:
  method: dft
  file: ../../DATA/DIA/tms_ref.out
experiment:
  files: generated_shifts.csv
assignment:
  method: moments
  max_moment_order: 10
linewidth:
  method: r6
  variables:
    p1:
    - fit
    - 1.0
    - [0.0, 1000000.0]
    p2:
    - fit
    - 0.01
    - [0.001, 10.0]
susc_fit:
  type: split
  average_shifts: all
  variables:
    iso: [fix, 0.0]
    dxx: [fit, 0.0]
    dyy: [fit, 0.0]
    dxy: [fit, 0.0]
    dxz: [fit, 0.0]
    dyz: [fit, 0.0]
