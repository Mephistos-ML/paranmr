project:
  name: paranmr_gmm_fitted_output
hyperfine:
  method: pdip
  file: ../../DATA/HFC/YbL8.xyz
  paramagnetic_centre:
  - 0.0
  - 0.0
  - 0.0
  spin: 0.5
  orbit: 3.0
  total_momentum_J: 3.5
nuclei:
  include: H
diamagnetic:
  method: dft
  file: ../../DATA/DIA/LuL8_DIA_NMR.out
diamagnetic_ref:
  method: dft
  file: ../../DATA/DIA/tms_ref.out
experiment:
  files: generated_shifts.csv
assignment:
  method: moments
  moment_objective:
    number_of_moments: 10
    covariance:
      method: jacobian
      measurement_uncertainty:
        shift_sigma_abs: 0.02
        width_sigma_rel: 0.05
linewidth:
  method: r6
  variables:
    p1:
    - fit
    - 1.0
    - - 0.0
      - 1000000.0
    p2:
    - fit
    - 0.1
    - - 0.0
      - 10.0
susc_fit:
  type: split
  variables:
    iso: [fit, 0.0]
    dxx: [fit, -0.002560267873729879]
    dyy: [fit, 0.005800230093043623]
    dxy: [fit, 0.0005314367779005822]
    dxz: [fit, -0.0005233237864394349]
    dyz: [fit, 0.0029033674498646195]
