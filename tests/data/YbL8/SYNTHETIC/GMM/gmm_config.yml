project:
  name: paranmr_gmm_fitted_output
hyperfine:
  method: pdip
  file: ../../DATA/HFC/YbL8.xyz
  paramagnetic_centre:
  - 0.0
  - 0.0
  - 0.0
  spin: 0.5
  orbit: 3.0
  total_momentum_J: 3.5
nuclei:
  include: H
signal_labels:
  file: ../../DATA/LABELS/YbL8_labels.csv
diamagnetic:
  method: dft
  file: ../../DATA/DIA/LuL8_DIA_NMR.out
diamagnetic_ref:
  method: dft
  file: ../../DATA/DIA/tms_ref.out
experiment:
  files: generated_shifts.csv
assignment:
  method: moments
  moment_objective:
    number_of_moments: 10
    covariance:
      method: parameter_jacobian
linewidth:
  method: r6
  variables:
    p1:
    - fix
    - 518.933180241867
    p2:
    - fix
    - 0.239390978830240
susc_fit:
  type: split
  average_shifts: all
  variables:
    iso: [fix, 0.0]
    dxx: [fit, -0.002560267873729879]
    dyy: [fit, 0.005800230093043623]
    dxy: [fit, 0.0005314367779005822]
    dxz: [fit, -0.0005233237864394349]
    dyz: [fit, 0.0029033674498646195]
