name: CI

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gmm:
        description: Run the work-in-progress synthetic GMM acceptance test
        required: false
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Unit and experimental integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run unit, smoke, and experimental integration tests
        run: >-
          python -m pytest tests/unit tests/smoke
          tests/integration/experimental -k 'not gmm'

  synthetic:
    name: Synthetic GMM acceptance tests (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gmm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run synthetic acceptance suite
        run: python -m pytest tests/integration/synthetic

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package and docs requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
          python -m pip install -U anybadge

      - name: Build docs
        working-directory: docs
        run: make html

      - name: Add documentation badge
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' paranmr/__version__.py)
          rm -f docs/build/html/docs.svg
          anybadge -l Documentation -v "$VERSION" -f docs/build/html/docs.svg --color green -o

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
