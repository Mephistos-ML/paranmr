project:
  name: DyL1_1H_Fitting_Moments_iso_ax_rho
    
hyperfine:
  method: pdip
  file: ../../DATA/HFC/DyL1.xyz
  paramagnetic_centre: [0.006857, -0.008695, 0.057882]
  spin: 2.5
  orbit: 5
  total_momentum_J: 7.5

nuclei:
  include: H
      
diamagnetic:
  method: csv
  file: ../../DATA/DIA/YL1.csv

experiment:
  files: ../../DATA/PARA/DyL1_Exp_Decomposition.csv
  
chem_labels:
  file: ../../DATA/LABELS/DyL1_1H_Labels.csv
  
assignment:
  method: moments
  moment_weights:
    mean: 1.0
    std: 5.0
    skewness: 0.5
    kurtosis: 0.92
    standardized_5: 0.1
    standardized_6: 0.057
    
susc_fit:
  type: isoaxrho
  variables:
    iso: [fit, 0.0]
    ax: [fit, 0.001]
    rho_over_ax: [fix, 0.0]
  average_shifts: 'all'
