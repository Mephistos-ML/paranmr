project:
  name: DyL1_1H_Fitting
    
hyperfine:
  method: pdip
  file: ../../../DATA/HFC/DyL1.xyz
  paramagnetic_centre: [0.006857, -0.008695, 0.057882]
  spin: 2.5
  orbit: 5
  total_momentum_J: 7.5

nuclei:
  include: H
  
assignment:
  method: fixed
      
diamagnetic:
  method: dft
  file: ../../../DATA/DIA/YL1_DIA_NMR.out

diamagnetic_ref:
  method: dft
  file: ../../../DATA/DIA/tms_ref.out

linewidth:
  method: experimental
  calibration: p1_p2
  
experiment:
  files: ../../../DATA/PARA/DyL1_Exp_Decomposition.csv
  
signal_labels:
  file: ../../../DATA/LABELS/DyL1_1H_Labels.csv
  
susc_fit:
  type: isoaxrho
  variables:
    iso: [fix, 0.0]
    ax: [fit, -0.001]
    rho_over_ax: [fix, 0.0]
  average_shifts: 'all'