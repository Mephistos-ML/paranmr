project:
 name: C_H_SUSC_FIT_REDUCED_RH0

hyperfine:
 method: dft 
 file: ../DATA/Q_CHEM/FeH_opt_Cs_HFC_B3LYP_EPRII.out 

diamagnetic:
 method: csv
 file: ../DATA/DIA/Fe_H_dia.csv

experiment:
 files: [../DATA/EXPT/FeH_exp*.csv]

chem_labels:
 file: ../DATA/LABELS/atom_labels.csv

nuclei:
 include_groups: [C1,C2,C3,C4,C5,C6,C7,H2,H4]

assignment:
 method: fixed

susc_fit:
 type: isoaxrho
 variables:
  iso: [fit, 0.001]
  ax: [fit, 0.001]
  rho_over_ax: [fix, 0.0]
 average_shifts: 'all'
