project:
  name: YbL8_1H_PD_fit_Moments
  
hyperfine:
  method: pdip
  file: ../../../../DATA/HFC/YbL8.xyz
  paramagnetic_centre: [0.0, 0.0, 0.0]
  spin: 0.5
  orbit: 3
  total_momentum_J: 3.5

nuclei:
  include: H
  
diamagnetic:
  method: dft
  file: ../../../../DATA/DIA/LuL8_DIA_NMR.out

diamagnetic_ref:
  method: dft
  file: ../../../../DATA/DIA/tms_ref.out

experiment:
  files: ../../../../DATA/PARA/exp.csv

assignment:
  method: moments
  moment_objective:
    number_of_moments: 6
    covariance:
      method: jacobian
      measurement_uncertainty:
        shift_sigma_abs: 0.02
        width_sigma_rel: 0.05

linewidth:
  method: r6
  variables:
    p1: [fix, 705.05]
    p2: [fix, 0.25]
    
susc_fit:
  type: isoaxrho_euler
  variables:
    iso: [fix, 0.00]
    ax: [fit, 0.001]
    rho_over_ax: [fit, 0.0]
    alpha: [fix, 188.299]
    beta: [fix, 21.861]
    gamma: [fix, 209.965]
  average_shifts: 'methyls'
  objective_map:
    parameters: [ax, rho_over_ax]
