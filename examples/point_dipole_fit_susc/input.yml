---
project:
  name: proton

hyperfine:
  method: pdip
  file: m06-2x.xyz
  pdip_centres: ['Yb1']
  average: [
    'tBu',
    ['Me1', 'Me2'],
    'Me3'
  ]

experiment:
  files: exp.csv

diamagnetic:
  method: csv
  file: dia.csv

chem_labels:
  file: chem_labels.csv

nuclei:
  include: all_H

susc_fit:
  type: split
  variables:
    iso: [fix, 0.]
    dxx: [fit, 0.1]
    dxy: [fit, 0.01]
    dxz: [fit, 0.01]
    dyy: [fit, 0.1]
    dyz: [fit, 0.01]

# Permutation groups which modify initial
# assignment in experiment file
assignment:
  method: permute
  groups:
    - [Me1, Me2, Me3]
...
